name: Playwright Tests in Docker

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch the repository code onto the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Build the Docker image using the project Dockerfile
      # This downloads the official Playwright base image and installs node_modules
      - name: Build Docker Image
        run: docker build -t my-playwright-tests .

      # 3. Execute tests inside the isolated Docker container
      # -e CI=true passes the CI variable into the container so the environment setup knows it's running on GitHub
      # --ipc=host prevents Chromium crashes due to shared memory limits
      # -v mounts the host directory to capture the HTML report generated inside the container
      - name: Run Playwright tests inside Docker Container
        run: |
          docker run --name playwright-container \
            -e CI=true \
            --ipc=host \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            my-playwright-tests

      # 4. Extract and preserve the HTML test report as a build artifact
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
