name: Playwright Tests in Docker

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch the repository code using the updated v5 action (Node 24 native)
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Build the Docker image using the project Dockerfile
      - name: Build Docker Image
        run: docker build -t my-playwright-tests .

      # 3. Execute tests inside the isolated Docker container
      - name: Run Playwright tests inside Docker Container
        run: |
          docker run --name playwright-container \
            -e CI=true \
            --ipc=host \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            my-playwright-tests

      # 4. Extract and preserve the HTML test report
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
